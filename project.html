<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 — 주대희</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111110;--bg2:#1A1A18;--surface:#222220;--surface2:#2A2A28;
  --ink:#F2F0EB;--ink2:#9A9890;--ink3:#5A5855;
  --accent:#4B7BE0;--accent2:#7BA3EC;--green:#3ECF6A;--yellow:#F5C842;
  --border:rgba(255,255,255,.08);
  --sans:'Noto Sans KR',sans-serif;
  --serif:'Noto Serif KR',serif;
  --mono:'Inter',sans-serif;
}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:0 48px;height:60px;display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--border);
  background:rgba(17,17,16,.92);backdrop-filter:blur(14px);
}
.nav-back{font-family:var(--mono);font-size:13px;color:var(--ink3);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .15s}
.nav-back:hover{color:var(--ink)}
.nav-sep{color:var(--ink3);opacity:.3}
.nav-title{font-family:var(--mono);font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:380px}

/* HERO */
.hero{padding:100px 48px 72px;border-bottom:1px solid var(--border)}
.hero-inner{max-width:1100px;margin:0 auto}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-bottom:36px}
.hero-eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);margin-bottom:14px}
.hero-title{font-family:var(--serif);font-size:clamp(30px,4vw,54px);font-weight:900;line-height:1.1;letter-spacing:-1.5px;color:var(--ink);max-width:620px}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.hero-tag{font-size:11px;font-family:var(--mono);border:1px solid var(--border);color:var(--ink3);padding:3px 9px;border-radius:4px}
.hero-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.hero-period{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.hero-role{font-size:12px;font-family:var(--mono);font-weight:600;color:var(--accent2);border:1px solid rgba(123,163,236,.3);padding:4px 12px;border-radius:4px}
.status-live{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--green)}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero-summary{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 28px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.sum-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.sum-text{font-size:13px;color:var(--ink2);line-height:1.65}
.sum-text strong{color:var(--ink);font-weight:600}

/* SECTION 공통 */
.sec{padding:64px 48px;border-bottom:1px solid var(--border)}
.sec-inner{max-width:1100px;margin:0 auto}
.sec-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent2);margin-bottom:28px;display:flex;align-items:center;gap:14px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── 인터랙티브 AS-IS → TO-BE 흐름도 ── */
.flow-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:28px;width:fit-content}
.flow-tab{
  font-family:var(--mono);font-size:12px;font-weight:600;
  padding:10px 24px;background:transparent;border:none;cursor:pointer;
  color:var(--ink3);transition:all .2s;
}
.flow-tab.active{background:var(--surface);color:var(--ink)}
.flow-tab:not(:last-child){border-right:1px solid var(--border)}

.flow-panel{display:none}
.flow-panel.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.flow-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.flow-card{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:18px 20px;cursor:pointer;transition:all .2s;position:relative;
}
.flow-card:hover{border-color:rgba(123,163,236,.3);background:var(--surface2)}
.flow-card.expanded{border-color:var(--accent2)}
.flow-icon{font-size:22px;margin-bottom:10px}
.flow-card h4{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.flow-card .fc-sub{font-size:12px;color:var(--ink3)}
.flow-detail{
  max-height:0;overflow:hidden;transition:max-height .35s ease, opacity .3s ease;
  opacity:0;
}
.flow-card.expanded .flow-detail{max-height:200px;opacity:1}
.flow-detail-inner{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.flow-detail ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.flow-detail li{font-size:12px;color:var(--ink2);padding-left:12px;position:relative;line-height:1.5}
.flow-detail li::before{content:'·';position:absolute;left:0;color:var(--accent2)}

.flow-arrow{
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--accent2);margin:16px 0;
  animation:arrowPulse 1.5s ease-in-out infinite;
}
@keyframes arrowPulse{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(3px)}}

/* ── Pain Point 인터랙티브 ── */
.pain-quote{
  font-family:var(--serif);font-size:clamp(18px,2.2vw,26px);font-weight:700;
  line-height:1.4;color:var(--ink);padding-left:18px;border-left:3px solid var(--accent2);
  margin-bottom:28px;max-width:680px;
}
.pain-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start}
.pain-col h3{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.pain-col.left h3{color:#FF6B6B}
.pain-col.right h3{color:var(--green)}
.pain-vs-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:36px;gap:6px;font-size:22px;color:var(--accent2)}
.pain-item{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .2s;
}
.pain-item:hover{border-color:rgba(255,107,107,.3)}
.pain-item.sol:hover{border-color:rgba(62,207,106,.3)}
.pain-item.expanded{border-color:rgba(255,107,107,.4)}
.pain-item.sol.expanded{border-color:rgba(62,207,106,.4)}
.pain-item-head{display:flex;align-items:center;gap:10px}
.pain-item-icon{font-size:16px}
.pain-item-title{font-size:13px;font-weight:600;color:var(--ink);flex:1}
.pain-item-arrow{font-size:12px;color:var(--ink3);transition:transform .2s}
.pain-item.expanded .pain-item-arrow{transform:rotate(90deg)}
.pain-item-body{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s;opacity:0}
.pain-item.expanded .pain-item-body{max-height:120px;opacity:1}
.pain-item-body p{font-size:12px;color:var(--ink2);line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}

/* ── Agent 구조 인터랙티브 ── */
.agent-diagram{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:0;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
.agent-col{padding:24px 20px}
.agent-col-title{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent2);margin-bottom:16px;text-align:center}
.agent-items{display:flex;flex-direction:column;gap:8px}
.agent-item{
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:10px 14px;cursor:pointer;transition:all .2s;
  font-size:13px;color:var(--ink2);text-align:center;
}
.agent-item:hover,.agent-item.active{background:rgba(75,123,224,.12);border-color:var(--accent2);color:var(--ink)}
.agent-arrow-col{display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:18px;color:var(--ink3)}
.agent-detail{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:20px 24px;min-height:80px;transition:all .3s}
.agent-detail h4{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px}
.agent-detail p{font-size:13px;color:var(--ink2);line-height:1.65}

/* ── 성과 카운트업 ── */
.result-section{position:relative;overflow:hidden}
.result-section::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 50%, rgba(75,123,224,.12) 0%, transparent 60%),
             radial-gradient(ellipse at 80% 50%, rgba(62,207,106,.08) 0%, transparent 60%);
  pointer-events:none;
}
.result-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:40px;
  position:relative;z-index:1;
}
.result-cell{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:28px 24px;
  transition:transform .2s, border-color .2s, box-shadow .2s;
  cursor:default;
  position:relative;overflow:hidden;
}
.result-cell::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:2px;background:var(--accent2);
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s cubic-bezier(.4,0,.2,1);
}
.result-cell:hover{
  transform:translateY(-4px);
  border-color:rgba(123,163,236,.3);
  box-shadow:0 12px 32px rgba(0,0,0,.2);
}
.result-cell:hover::after{transform:scaleX(1)}
.result-eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink3);margin-bottom:12px;
}
.result-num{
  font-family:var(--mono);font-size:48px;font-weight:700;
  color:var(--ink);letter-spacing:-3px;line-height:1;
  display:flex;align-items:baseline;gap:4px;
}
.result-unit{font-size:22px;color:var(--accent2);font-weight:600;letter-spacing:0}
.result-label{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.45;font-weight:500}
.result-bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:14px;overflow:hidden}
.result-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),rgba(62,207,106,.8));width:0;transition:width 1.4s cubic-bezier(.4,0,.2,1)}

.result-desc-wrap{
  position:relative;z-index:1;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:24px 28px;
  border-left:3px solid var(--accent2);
}
.result-desc{font-size:15px;color:var(--ink2);line-height:1.85}
.result-desc strong{color:var(--ink);font-weight:600}

/* ── 이미지 ── */
.img-stack{display:flex;flex-direction:column;gap:14px}
.img-frame{border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.img-bar{height:30px;background:var(--surface2);display:flex;align-items:center;padding:0 12px;gap:6px;border-bottom:1px solid var(--border)}
.img-dot{width:8px;height:8px;border-radius:50%}
.img-frame img{width:100%;display:block;transition:transform .4s}
.img-frame:hover img{transform:scale(1.015)}
.img-cap{padding:8px 14px;font-family:var(--mono);font-size:11px;color:var(--ink3)}

/* ── 회고 ── */
.learn-list{display:flex;flex-direction:column;gap:10px}
.learn-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:16px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;transition:border-color .2s;
}
.learn-item:hover{border-color:rgba(123,163,236,.25)}
.lb{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;flex-shrink:0;margin-top:1px}
.lb-keep{background:#EDF7F0;color:#1A6636}
.lb-learn{background:#EBF1FD;color:#2955B0}
.lb-next{background:#F3EFF9;color:#6B43B5}
.learn-text{font-size:13px;color:var(--ink2);line-height:1.65}
.learn-text strong{color:var(--ink)}

/* WIP */
.wip-page{padding:120px 48px;max-width:1100px;margin:0 auto;text-align:center}

/* 하단 네비 */
.proj-nav{padding:36px 48px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border)}
.proj-nav a{font-family:var(--mono);font-size:13px;color:var(--ink3);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .15s}
.proj-nav a:hover{color:var(--ink)}

@media(max-width:768px){
  nav,.hero,.sec,.proj-nav{padding-left:20px;padding-right:20px}
  .hero-summary{grid-template-columns:1fr;gap:14px}
  .pain-vs{grid-template-columns:1fr;gap:12px}
  .pain-vs-arrow{display:none}
  .agent-diagram{grid-template-columns:1fr;gap:0}
  .agent-arrow-col{transform:rotate(90deg);padding:8px 0}
}

/* ── 스크린 탭 ── */
.screen-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;width:fit-content;margin-bottom:16px}
.stab{font-family:var(--mono);font-size:12px;font-weight:600;padding:9px 20px;background:transparent;border:none;cursor:pointer;color:var(--ink3);transition:all .2s}
.stab.active{background:var(--surface);color:var(--ink)}
.stab:not(:last-child){border-right:1px solid var(--border)}

/* ── 브라우저 프레임 ── */
.browser-frame{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#1A1A2E}
.browser-bar{height:40px;background:#12121E;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid var(--border)}
.b-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.b-url{flex:1;font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:center}
.b-badge{font-family:var(--mono);font-size:10px;color:var(--accent2);display:flex;align-items:center;flex-shrink:0}

/* ── 앱 셸 ── */
.app-shell{display:grid;grid-template-columns:160px 1fr;height:480px}
.app-sidebar{background:#0F0F1A;border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:20px}
.app-logo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);padding:4px}
.sidebar-nav{display:flex;flex-direction:column;gap:2px}
.snav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:12px;color:var(--ink3);cursor:pointer;transition:all .15s}
.snav-item:hover,.snav-item.active{background:rgba(75,123,224,.12);color:var(--accent2)}
.app-main{overflow:hidden;position:relative;background:#13131F}
.app-screen{display:none;height:100%;overflow-y:auto;padding:20px 24px}
.app-screen.active{display:block;animation:fadeIn .25s ease}
.screen-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.screen-title{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink)}
.screen-meta{font-size:11px;color:var(--ink3);margin-top:3px}
.add-btn{font-family:var(--mono);font-size:11px;font-weight:600;padding:6px 12px;border-radius:5px;background:var(--accent);color:#fff;border:none;cursor:pointer}
.add-btn.outline{background:transparent;border:1px solid var(--border);color:var(--ink2)}

/* 긴급 이슈 배너 */
.alert-banner{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.alert-dot{width:8px;height:8px;border-radius:50%;background:#FF6B6B;flex-shrink:0;animation:pulse 1.5s infinite}
.alert-title{font-size:13px;font-weight:700;color:#FF6B6B}
.alert-desc{font-size:12px;color:var(--ink2)}
.alert-badge{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;color:#FF6B6B;border:1px solid rgba(255,107,107,.3);padding:3px 8px;border-radius:4px;flex-shrink:0;cursor:pointer}

/* 인사이트 그리드 */
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.insight-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.insight-card.wide{grid-column:1/-1}
.ic-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:12px}
.ic-sub{font-size:11px;color:var(--ink3);font-weight:400;margin-left:6px}

/* 감정 분석 바 */
.sentiment-bars{display:flex;flex-direction:column;gap:8px}
.sent-row{display:flex;align-items:center;gap:8px}
.sent-label{font-size:11px;color:var(--ink3);width:26px;flex-shrink:0}
.sent-track{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.sent-fill{height:100%;border-radius:4px;width:0;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.sent-fill.pos{background:#3ECF6A}
.sent-fill.neu{background:#F5C842}
.sent-fill.neg{background:#FF6B6B}
.sent-pct{font-family:var(--mono);font-size:11px;color:var(--ink2);width:28px;text-align:right;flex-shrink:0}

/* 트렌드 차트 */
.trend-chart{padding:4px 0 0}
.trend-days{display:flex;justify-content:space-between;margin-top:4px}
.trend-days span{font-family:var(--mono);font-size:10px;color:var(--ink3)}

/* 리스크 */
.risk-list{display:flex;flex-direction:column;gap:7px}
.risk-row{display:flex;align-items:center;gap:8px}
.risk-label{font-size:11px;color:var(--ink2);width:60px;flex-shrink:0}
.risk-track{flex:1;height:6px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
.risk-fill{height:100%;border-radius:3px;transition:width 1s ease .2s}
.risk-pct{font-family:var(--mono);font-size:10px;color:var(--ink3);width:28px;text-align:right}

/* 에이전트 카드 */
.agent-cards{display:flex;flex-direction:column;gap:10px}
.agent-card-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.aci-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.aci-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.aci-name{font-size:13px;font-weight:600;color:var(--ink)}
.aci-role{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.aci-status{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;flex-shrink:0}
.aci-status.on{background:rgba(62,207,106,.12);color:#3ECF6A}
.aci-status.off{background:rgba(255,255,255,.06);color:var(--ink3)}
.aci-meta{display:flex;gap:12px;font-size:11px;color:var(--ink3)}

/* 지식 관리 */
.knowledge-desc{font-size:12px;color:var(--ink3);margin-bottom:14px}
.knowledge-groups{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kg-card{background:rgba(75,123,224,.08);border:1px solid rgba(75,123,224,.2);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:8px;font-size:12px}
.kg-icon{font-size:16px}
.kg-name{color:var(--ink2);font-weight:500}
.kg-count{color:var(--ink3);font-family:var(--mono);font-size:11px}
.kg-status{margin-left:auto;font-family:var(--mono);font-size:10px;color:#3ECF6A}
.knowledge-table{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.kt-header{display:grid;grid-template-columns:60px 1fr 80px;padding:8px 14px;font-family:var(--mono);font-size:10px;color:var(--ink3);border-bottom:1px solid var(--border);gap:8px}

  '실제 구현 화면 — 우체국 행복이, W사 CS챗봇 납품 화면 및 NOA 어드민',
];
function switchScreen(idx, btn){
  // 탭 버튼
  if(btn){
    document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  // 사이드 네비
  [0,1,2,3].forEach(i=>{
    const el=document.getElementById('snav-'+i);
    if(el) el.classList.toggle('active', i===idx);
  });
  // 스크린
  document.querySelectorAll('.app-screen').forEach((s,i)=>{
    s.classList.toggle('active', i===idx);
  });
  // 캡션
  const cap=document.getElementById('screen-caption');
  if(cap) cap.textContent=screenCaptions[idx]||'';
  // 바 애니메이션 트리거
  if(idx===0) animateSentimentBars();
}
function animateSentimentBars(){
  setTimeout(()=>{
    document.querySelectorAll('.sent-fill').forEach(el=>{
      el.style.width = el.style.getPropertyValue('--w') || el.getAttribute('style').match(/--w:([^%]+%)/)?.[1] || '0%';
    });
    document.querySelectorAll('.risk-fill').forEach(el=>{ el.style.width = el.style.width; });
  }, 100);
}

          {type:'learn',label:'LEARN',text:'<strong>Agile 환경에서 스펙 변경 관리</strong> — AI 모델 성능에 따라 UI 스펙이 빈번히 바뀌었고, 변경 이력을 명확히 추적하는 문서화 체계가 더 필요했음.'},

}

/* 카운트업 + 바 애니메이션 */
function animateResults(){
  document.querySelectorAll('[data-target]').forEach(el=>{
    const target = +el.dataset.target;
    if(target===0){el.textContent='0';return;}
    const start=performance.now();
    const dur=1200;
    (function step(now){
      const p=Math.min((now-start)/dur,1);
      const ease=1-Math.pow(1-p,3);
      el.textContent=Math.floor(ease*target);
      if(p<1) requestAnimationFrame(step);
      else el.textContent=target;
    })(start);
  });
  document.querySelectorAll('.result-bar-fill[data-pct]').forEach((el,i)=>{
    setTimeout(()=>{el.style.width=el.dataset.pct+'%'}, i*120);
  });
}

/* ===================== 렌더 ===================== */
const id = new URLSearchParams(location.search).get('id') || 'noa-agent';
const p = DATA[id];
document.getElementById('nav-title').textContent = p.title;
document.getElementById('next-link').href = `project.html?id=${p.next}`;

if(p.wip){
  document.getElementById('content').innerHTML=`
    <div class="wip-page">
      <p style="font-family:var(--mono);font-size:11px;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px">Coming Soon</p>
      <h1 style="font-family:var(--serif);font-size:42px;font-weight:900;color:var(--ink);margin-bottom:14px">${p.title}</h1>
      <p style="font-size:15px;color:var(--ink2)">상세 페이지 작성 중입니다.</p>
    </div>`;
} else {
  let sections = buildHero(p);
  if(p.type==='agent') sections += buildAgentSections();
  else if(p.type==='qa') sections += buildQaSections();
  else if(p.type==='insight') sections += buildInsightSections();
  else if(p.type==='ai-textbook') sections += buildAiTextbookSections();
  else if(p.type==='ai-dreamsam') sections += buildAiDreamsamSections();
  else if(p.type==='math-cells') sections += buildMathCellsSections();
  else if(p.type==='tutor-admin') sections += buildTutorAdminSections();
  else if(p.type==='mock-exam') sections += buildMockExamSections();
  else if(p.type==='mega-renewal') sections += buildMegaRenewalSections();
  document.getElementById('content').innerHTML = sections;

  // 인사이트 화면 바 초기 애니메이션
  setTimeout(animateSentimentBars, 600);

  // 성과 섹션 진입 시 애니메이션
  const resultObs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ animateResults(); resultObs.disconnect(); }
    });
  },{threshold:.2});
  const resultEl = document.querySelector('.result-grid');
  if(resultEl) resultObs.observe(resultEl);
}
</script>
