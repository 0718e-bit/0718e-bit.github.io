<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 — 댕댕</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F3;
  --surface:#F0EEE9;
  --dark:#22242C;
  --ink:#1A1A1A;
  --ink2:#5C5B56;
  --ink3:#A09E97;
  --accent:#4B7BE0;
  --accent-dim:#7BA3EC;
  --accent-light:#EBF1FD;
  --border:#E4E2DC;
  --card:#FFFFFF;
  --sans:'Noto Sans KR',sans-serif;
  --serif:'Noto Serif KR',serif;
  --mono:'Inter',sans-serif;
}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}

nav{
  position:sticky;top:0;z-index:100;
  background:rgba(247,246,243,0.93);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 48px;height:56px;
  display:flex;align-items:center;gap:14px;
}
.nav-back{font-family:var(--mono);font-size:13px;color:var(--ink3);text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .15s}
.nav-back:hover{color:var(--ink)}
.nav-sep{color:var(--border);font-size:18px;font-weight:200}
.nav-cur{font-family:var(--mono);font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* HERO */
.hero-band{background:var(--dark);color:#fff;padding:76px 48px 68px}
.hero-inner{max-width:820px;margin:0 auto}
.hero-meta{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.meta-co{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1.2px;color:rgba(255,255,255,.4);text-transform:uppercase}
.meta-dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.2)}
.meta-dt{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.35)}
.hero-title{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1.2;letter-spacing:-1px;color:#fff}
.hero-tags{margin-top:18px;display:flex;gap:7px;flex-wrap:wrap}
.hero-tag{font-size:12px;font-family:var(--mono);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.55);padding:3px 10px;border-radius:4px}
.hero-artifacts{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.art-link{display:flex;align-items:center;gap:7px;font-size:13px;font-family:var(--mono);padding:8px 16px;border-radius:6px;text-decoration:none;transition:opacity .15s}
.art-link:hover{opacity:.8}
.al-proto{background:#4B7BE0;color:#fff}
.al-doc{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.18)}
.al-figma{background:#7B61FF;color:#fff}

/* SECTIONS */
.sec{padding:68px 48px}
.sec-inner{max-width:820px;margin:0 auto}
.sec-label{
  font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;color:var(--accent-dim);margin-bottom:24px;
  display:flex;align-items:center;gap:10px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* 페인포인트 */
.pain-sec{background:var(--surface)}
.pain-quote{
  font-family:var(--serif);font-size:26px;font-weight:700;
  line-height:1.45;letter-spacing:-.4px;color:var(--ink);
  padding-left:20px;border-left:3px solid var(--accent-dim);margin-bottom:28px;
}
.pain-ctx{font-size:15px;color:var(--ink2);line-height:1.8}
.pain-list{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.pain-item{
  display:flex;gap:14px;align-items:flex-start;
  padding:15px 17px;background:#fff;border-radius:8px;border:1px solid var(--border);
}
.pain-icon{font-size:17px;flex-shrink:0;margin-top:1px}
.pain-txt{font-size:14px;color:var(--ink2);line-height:1.6}
.pain-txt strong{color:var(--ink);font-weight:600}

/* 솔루션 */
.sol-sec{background:#fff}
.sol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:4px}
.sol-card{padding:18px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}
.sol-n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent-dim);margin-bottom:9px}
.sol-card h4{font-size:14px;font-weight:700;margin-bottom:5px}
.sol-card p{font-size:13px;color:var(--ink2);line-height:1.55}

/* 산출물 */
.art-sec{background:var(--bg)}
.screen-frame{background:var(--dark);border-radius:12px;overflow:hidden;border:1px solid #2C2E38;margin-top:4px}
.screen-bar{height:34px;background:#272930;display:flex;align-items:center;padding:0 14px;gap:6px}
.s-dot{width:9px;height:9px;border-radius:50%}
.screen-body{
  min-height:340px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:40px;text-align:center;
}
.screen-ph{font-family:var(--mono);font-size:12px;color:var(--ink3);line-height:1.9;letter-spacing:.3px}
.screen-cta{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-family:var(--mono);
  background:var(--accent);color:#fff;
  padding:9px 18px;border-radius:6px;text-decoration:none;margin-top:4px;transition:opacity .15s;
}
.screen-cta:hover{opacity:.85}

/* 성과 */
.res-sec{background:var(--dark);color:#fff}
.res-sec .sec-label{color:rgba(123,163,236,.8)}
.res-sec .sec-label::after{background:rgba(255,255,255,.08)}
.res-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;margin-bottom:36px;
}
.res-cell{background:var(--dark);padding:26px 22px}
.res-num{font-family:var(--mono);font-size:38px;font-weight:600;color:#fff;letter-spacing:-1.5px;line-height:1}
.res-unit{font-size:18px;color:var(--accent-dim)}
.res-label{font-size:12px;color:rgba(255,255,255,.4);margin-top:7px;line-height:1.4}
.res-desc{font-size:15px;color:rgba(255,255,255,.55);line-height:1.8;max-width:580px}
.res-desc strong{color:rgba(255,255,255,.82)}

/* 회고 */
.learn-sec{background:var(--bg)}
.learn-list{display:flex;flex-direction:column;gap:13px;margin-top:4px}
.learn-item{padding:18px 20px;background:#fff;border-radius:8px;border:1px solid var(--border);display:flex;gap:14px;align-items:flex-start}
.learn-badge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.5px;padding:3px 8px;border-radius:4px;flex-shrink:0;margin-top:2px}
.lb-keep{background:#EDF7F0;color:#1A6636}
.lb-learn{background:#EBF1FD;color:#2955B0}
.lb-next{background:#F3EFF9;color:#6B43B5}
.learn-txt{font-size:14px;color:var(--ink2);line-height:1.65}
.learn-txt strong{color:var(--ink)}

.proj-nav{border-top:1px solid var(--border);padding:36px 48px;display:flex;justify-content:space-between;align-items:center}
.proj-nav a{font-family:var(--mono);font-size:13px;color:var(--ink3);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .15s}
.proj-nav a:hover{color:var(--ink)}

@media(max-width:768px){
  nav,.sec,.hero-band,.proj-nav{padding-left:24px;padding-right:24px}
  .hero-title{font-size:28px}
  .pain-quote{font-size:20px}
  .res-num{font-size:30px}
}
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="index.html">← 전체 프로젝트</a>
  <span class="nav-sep">|</span>
  <span class="nav-cur" id="nav-title">로드 중…</span>
</nav>

<div class="hero-band">
  <div class="hero-inner">
    <div class="hero-meta">
      <span class="meta-co" id="h-co"></span>
      <span class="meta-dot"></span>
      <span class="meta-dt" id="h-dt"></span>
    </div>
    <h1 class="hero-title" id="h-title"></h1>
    <div class="hero-tags" id="h-tags"></div>
    <div class="hero-artifacts" id="h-arts"></div>
  </div>
</div>

<section class="sec pain-sec">
  <div class="sec-inner">
    <div class="sec-label">Painpoint</div>
    <blockquote class="pain-quote" id="pain-q"></blockquote>
    <p class="pain-ctx" id="pain-ctx"></p>
    <div class="pain-list" id="pain-list"></div>
  </div>
</section>

<section class="sec sol-sec">
  <div class="sec-inner">
    <div class="sec-label">Solution</div>
    <div class="sol-grid" id="sol-grid"></div>
  </div>
</section>

<section class="sec art-sec">
  <div class="sec-inner">
    <div class="sec-label">산출물</div>
    <div class="screen-frame">
      <div class="screen-bar">
        <div class="s-dot" style="background:#FF5F57"></div>
        <div class="s-dot" style="background:#FFBD2E"></div>
        <div class="s-dot" style="background:#28CA41"></div>
      </div>
      <div class="screen-body" id="screen-body"></div>
    </div>
  </div>
</section>

<section class="sec res-sec">
  <div class="sec-inner">
    <div class="sec-label">성과</div>
    <div class="res-grid" id="res-grid"></div>
    <p class="res-desc" id="res-desc"></p>
  </div>
</section>

<section class="sec learn-sec">
  <div class="sec-inner">
    <div class="sec-label">회고</div>
    <div class="learn-list" id="learn-list"></div>
  </div>
</section>

<div class="proj-nav">
  <a href="index.html">← 전체 목록으로</a>
  <a id="next-link" href="#">다음 프로젝트 →</a>
</div>

<script>
const data={
  "noa-report":{
    co:"Spectra · GAON Partner+",dt:"2025.06",
    title:"NOA 종합 분석 리포트",
    tags:["AI","B2B SaaS","어드민"],
    arts:[
      {label:"프로토타입 보기",href:"prototype/noa-report.html",cls:"al-proto"},
      {label:"기획서 보기",href:"docs/noa-report.md",cls:"al-doc"}
    ],
    painQ:"팀장은 매월 2일을 스프레드시트 복붙에 소비하고 있었다.",
    painCtx:"영업 사원의 역량 점수 데이터가 CS Talk, LiveTalk, 개별 CRM에 분산되어 있어, 팀장이 월간 보고를 위해 수작업으로 취합하는 구조였습니다.",
    painItems:[
      {i:"⏱",t:"<strong>월 16시간 낭비</strong> — 데이터 취합·정리에만 소요되는 반복 작업"},
      {i:"📊",t:"<strong>맥락 없는 숫자</strong> — 점수만 있고 '왜 낮은지'에 대한 분석 부재"},
      {i:"🔍",t:"<strong>비교 불가</strong> — 팀원 간 역량을 동일 기준으로 볼 수 있는 뷰 없음"},
    ],
    sols:[
      {n:"01",title:"데이터 통합 뷰",desc:"CS Talk·LiveTalk 데이터를 하나의 대시보드로 집계. 팀 전체 현황을 한 화면에서 파악."},
      {n:"02",title:"역량 레이더 차트",desc:"개인별 6개 역량 항목을 시각화. 강점/약점 패턴을 즉시 식별 가능."},
      {n:"03",title:"AI 코칭 포인트",desc:"점수 하락 원인을 LLM이 자동 분석. 팀장이 1:1 미팅 전 컨텍스트를 미리 파악."},
      {n:"04",title:"아코디언 상세",desc:"카드 클릭으로 통화 예시·개선 제안 펼치기. 필요할 때만 깊이 들어가는 UX."},
    ],
    screenPh:"prototype/noa-report.html 파일을\n이 폴더에 넣으면 여기에 임베드됩니다.",
    protoHref:"prototype/noa-report.html",
    results:[{num:"16",unit:"h",label:"월간 절감 시간"},{num:"3",unit:"×",label:"분석 속도 향상"},{num:"5",unit:"명",label:"파일럿 팀장 참여"}],
    resDesc:"<strong>기획 단계 파일럿</strong>에서 팀장 5명이 기존 대비 현저히 빠른 인사이트 도출을 경험. 데이터 취합 업무가 사라지고 코칭 대화에 집중하는 시간이 늘었다는 피드백을 받음.",
    learns:[
      {type:"keep",label:"KEEP",t:"<strong>초기에 '팀장의 하루'를 따라가는 섀도잉</strong> — 페인포인트를 직접 목격한 것이 설득력 있는 기획서의 토대가 됨."},
      {type:"learn",label:"LEARN",t:"<strong>집계 로직 정의가 기획의 절반</strong> — UI보다 '어떤 기준으로 점수를 내는가'를 데이터팀과 먼저 정렬해야 했음."},
      {type:"next",label:"NEXT",t:"<strong>모바일 뷰</strong> — 현장 팀장이 이동 중 확인하는 시나리오가 많아 모바일 최적화 버전 기획 예정."},
    ]
  },
  "cs-talk-dashboard":{
    co:"Spectra · Cowork+",dt:"2025.05",
    title:"CS Talk 영업 대화 분석 대시보드",
    tags:["AI","B2B SaaS","NLP"],
    arts:[{label:"프로토타입 보기",href:"prototype/cs-talk-dashboard.html",cls:"al-proto"}],
    painQ:"통화 데이터는 매일 쌓이는데, 아무도 그걸 읽지 않았다.",
    painCtx:"케이블 영업사원의 CS Talk 통화 데이터가 서버에만 저장되고 코칭·성과 분석에는 전혀 활용되지 않는 상황. 관리자는 여전히 직감과 경험으로만 팀을 운영하고 있었습니다.",
    painItems:[
      {i:"💾",t:"<strong>데이터 사장</strong> — 수만 건의 통화가 분석 없이 스토리지에만 적재"},
      {i:"🎯",t:"<strong>코칭 근거 부재</strong> — '잘한다/못한다'를 설명할 객관적 지표 없음"},
      {i:"📉",t:"<strong>성과 원인 불명</strong> — 왜 이번 달 계약률이 떨어졌는지 파악 불가"},
    ],
    sols:[
      {n:"01",title:"대화 패턴 분석",desc:"NLP로 고성과자 vs 저성과자의 통화 구조 차이를 자동 추출."},
      {n:"02",title:"KPI 대시보드",desc:"계약률·통화 시간·이의 처리율 등 핵심 지표를 한 화면에 집약."},
      {n:"03",title:"개인별 피드백",desc:"AI가 각 사원의 통화에서 반복되는 약점 패턴을 요약해 코칭 카드 제공."},
    ],
    screenPh:"prototype/cs-talk-dashboard.html 파일을\n이 폴더에 넣으면 여기에 임베드됩니다.",
    protoHref:"prototype/cs-talk-dashboard.html",
    results:[{num:"40",unit:"%",label:"코칭 준비 시간 단축"},{num:"12",unit:"개",label:"추출 KPI 항목"}],
    resDesc:"관리자가 팀 전체 상황을 파악하는 데 걸리는 시간이 줄고, <strong>데이터 기반 코칭 문화</strong>의 시작점을 만듦.",
    learns:[
      {type:"keep",label:"KEEP",t:"<strong>실제 통화 샘플 20건을 직접 들어본 것</strong> — 추상적 기획이 아니라 실제 대화 흐름 기반으로 설계할 수 있었음."},
      {type:"learn",label:"LEARN",t:"<strong>지표 정의에 현장 합의 필요</strong> — '계약률'의 정의가 팀마다 달랐고, 통일 전에 대시보드를 먼저 만들어 혼선."},
      {type:"next",label:"NEXT",t:"<strong>실시간 알림</strong> — 특정 패턴 감지 시 관리자에게 즉시 알림을 보내는 기능 추가 검토."},
    ]
  }
};

const order=["noa-report","cs-talk-dashboard","secret-message","ai-financial-advisor","fund-comparison"];
const id=new URLSearchParams(location.search).get('id')||order[0];
const p=data[id];

if(!p){
  document.body.innerHTML='<div style="padding:80px;text-align:center;font-family:sans-serif;color:#999">준비 중인 프로젝트입니다.<br><a href="index.html" style="color:#4B7BE0">← 목록으로 돌아가기</a></div>';
}else{
  const tm={keep:'lb-keep',learn:'lb-learn',next:'lb-next'};
  document.getElementById('nav-title').textContent=p.title;
  document.getElementById('h-co').textContent=p.co;
  document.getElementById('h-dt').textContent=p.dt;
  document.getElementById('h-title').textContent=p.title;
  document.getElementById('h-tags').innerHTML=p.tags.map(t=>`<span class="hero-tag">${t}</span>`).join('');
  document.getElementById('h-arts').innerHTML=p.arts.map(a=>`<a class="art-link ${a.cls}" href="${a.href}" target="_blank">${a.label}</a>`).join('');
  document.getElementById('pain-q').textContent=p.painQ;
  document.getElementById('pain-ctx').textContent=p.painCtx;
  document.getElementById('pain-list').innerHTML=p.painItems.map(i=>`<div class="pain-item"><span class="pain-icon">${i.i}</span><p class="pain-txt">${i.t}</p></div>`).join('');
  document.getElementById('sol-grid').innerHTML=p.sols.map(s=>`<div class="sol-card"><div class="sol-n">${s.n}</div><h4>${s.title}</h4><p>${s.desc}</p></div>`).join('');
  document.getElementById('screen-body').innerHTML=`<p class="screen-ph">${p.screenPh}</p><a class="screen-cta" href="${p.protoHref}" target="_blank">프로토타입 열기 →</a>`;
  document.getElementById('res-grid').innerHTML=p.results.map(r=>`<div class="res-cell"><div class="res-num">${r.num}<span class="res-unit">${r.unit}</span></div><div class="res-label">${r.label}</div></div>`).join('');
  document.getElementById('res-desc').innerHTML=p.resDesc;
  document.getElementById('learn-list').innerHTML=p.learns.map(l=>`<div class="learn-item"><span class="learn-badge ${tm[l.type]}">${l.label}</span><p class="learn-txt">${l.t}</p></div>`).join('');
  const idx=order.indexOf(id);
  document.getElementById('next-link').href=`project.html?id=${order[(idx+1)%order.length]}`;
}
</script>
</body>
</html>
