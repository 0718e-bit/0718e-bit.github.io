<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 — 주대희</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111110;--bg2:#1A1A18;--surface:#222220;
  --ink:#F2F0EB;--ink2:#9A9890;--ink3:#5A5855;
  --accent:#4B7BE0;--accent2:#7BA3EC;
  --border:rgba(255,255,255,.08);
  --sans:'Noto Sans KR',sans-serif;
  --serif:'Noto Serif KR',serif;
  --mono:'Inter',sans-serif;
}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:0 48px;height:60px;
  display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--border);
  background:rgba(17,17,16,.9);backdrop-filter:blur(14px);
}
.nav-back{font-family:var(--mono);font-size:13px;color:var(--ink3);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .15s}
.nav-back:hover{color:var(--ink)}
.nav-sep{color:var(--ink3);opacity:.3}
.nav-title{font-family:var(--mono);font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px}

/* HERO BAND */
.hero{
  padding:100px 48px 80px;
  border-bottom:1px solid var(--border);
}
.hero-inner{max-width:1100px;margin:0 auto}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:40px;flex-wrap:wrap;margin-bottom:40px}
.hero-eyebrow{
  font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;color:var(--accent2);margin-bottom:16px;
}
.hero-title{
  font-family:var(--serif);
  font-size:clamp(32px,4.5vw,58px);
  font-weight:900;line-height:1.1;
  letter-spacing:-1.5px;color:var(--ink);
  max-width:640px;
}
.hero-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px}
.hero-tag{font-size:11px;font-family:var(--mono);border:1px solid var(--border);color:var(--ink3);padding:3px 10px;border-radius:4px}
.hero-meta{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.hero-period{font-family:var(--mono);font-size:12px;color:var(--ink3);text-align:right}
.hero-role{font-size:12px;font-family:var(--mono);font-weight:600;color:var(--accent2);border:1px solid rgba(123,163,236,.3);padding:4px 12px;border-radius:4px;text-align:right}
.status-live{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:600;color:#3ECF6A}
.status-dot{width:6px;height:6px;border-radius:50%;background:#3ECF6A;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* 핵심 요약 */
.hero-summary{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:28px 32px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;
}
.summary-item{}
.summary-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.summary-text{font-size:14px;color:var(--ink2);line-height:1.65}
.summary-text strong{color:var(--ink);font-weight:600}

/* SECTIONS 공통 */
.section{padding:72px 48px;border-bottom:1px solid var(--border)}
.section-inner{max-width:1100px;margin:0 auto}
.section-label{
  font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:2.5px;text-transform:uppercase;color:var(--accent2);
  margin-bottom:32px;display:flex;align-items:center;gap:14px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* 페인포인트 */
.pain-quote{
  font-family:var(--serif);
  font-size:clamp(20px,2.5vw,30px);
  font-weight:700;line-height:1.4;letter-spacing:-.5px;
  color:var(--ink);padding-left:20px;border-left:3px solid var(--accent2);
  margin-bottom:32px;max-width:720px;
}
.pain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pain-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:18px 20px;
  transition:border-color .2s;
}
.pain-card:hover{border-color:rgba(123,163,236,.3)}
.pain-icon{font-size:20px;margin-bottom:10px}
.pain-card h4{font-size:14px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.pain-card p{font-size:13px;color:var(--ink2);line-height:1.6}

/* 솔루션 */
.sol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:40px}
.sol-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px}
.sol-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent2);margin-bottom:10px}
.sol-card h4{font-size:14px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.sol-card p{font-size:13px;color:var(--ink2);line-height:1.6}

/* 이미지 갤러리 */
.img-section{background:var(--bg2)}
.img-grid{display:grid;gap:16px}
.img-grid.cols-2{grid-template-columns:1fr 1fr}
.img-grid.cols-1{grid-template-columns:1fr}
.img-frame{
  border-radius:10px;overflow:hidden;
  border:1px solid var(--border);
  background:var(--surface);
}
.img-bar{height:32px;background:var(--surface);display:flex;align-items:center;padding:0 12px;gap:6px;border-bottom:1px solid var(--border)}
.img-dot{width:8px;height:8px;border-radius:50%}
.img-frame img{width:100%;display:block;transition:transform .4s}
.img-frame:hover img{transform:scale(1.02)}
.img-caption{padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--ink3)}

/* 성과 */
.result-section{background:var(--bg)}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:32px}
.result-cell{background:var(--bg);padding:28px 24px}
.result-num{font-family:var(--mono);font-size:40px;font-weight:700;color:var(--ink);letter-spacing:-2px;line-height:1}
.result-unit{font-size:20px;color:var(--accent2)}
.result-label{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.4}
.result-desc{font-size:15px;color:var(--ink2);line-height:1.8;max-width:680px}
.result-desc strong{color:var(--ink)}

/* 회고 */
.learn-list{display:flex;flex-direction:column;gap:12px}
.learn-item{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.learn-badge{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 9px;border-radius:4px;flex-shrink:0;margin-top:2px}
.lb-keep{background:#EDF7F0;color:#1A6636}
.lb-learn{background:#EBF1FD;color:#2955B0}
.lb-next{background:#F3EFF9;color:#6B43B5}
.learn-text{font-size:14px;color:var(--ink2);line-height:1.65}
.learn-text strong{color:var(--ink)}

/* 하단 네비 */
.proj-nav{padding:40px 48px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border)}
.proj-nav a{font-family:var(--mono);font-size:13px;color:var(--ink3);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .15s}
.proj-nav a:hover{color:var(--ink)}

/* 숨겨진 프로젝트 */
.wip-notice{
  margin:20px 0;padding:16px 20px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  font-size:13px;color:var(--ink3);font-family:var(--mono);
}

@media(max-width:768px){
  nav{padding:0 20px}
  .hero{padding:80px 20px 48px}
  .section{padding:48px 20px}
  .hero-summary{grid-template-columns:1fr;gap:16px}
  .img-grid.cols-2{grid-template-columns:1fr}
  .proj-nav{padding:28px 20px}
  .hero-meta{align-items:flex-start}
}
</style>
</head>
